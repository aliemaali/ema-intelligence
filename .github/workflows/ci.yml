name: Sync pnpm lock

on:
  push:
    branches:
      - 'fix/projektliste-pdf-pnpm-lock'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/projektliste-pdf-pnpm-lock

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Synchronize pnpm lock file
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit synchronized lock file
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Synchronize pnpm lock file"
          git push origin HEAD:fix/projektliste-pdf-pnpm-lock
