name: Sync PDF runtime locks

on:
  push:
    branches:
      - 'fix/projektliste-pdf-chromium-149'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sync-pdf-runtime-locks
  cancel-in-progress: true

jobs:
  sync-locks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/projektliste-pdf-chromium-149
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm 10
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Synchronize lock files
        run: |
          pnpm install --lockfile-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lock files
        run: |
          if git diff --quiet -- pnpm-lock.yaml package-lock.json; then
            echo "Lock files already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml package-lock.json
          git commit -m "Synchronize Chromium 149 lock files"
          git pull --rebase origin fix/projektliste-pdf-chromium-149
          git push origin HEAD:fix/projektliste-pdf-chromium-149
